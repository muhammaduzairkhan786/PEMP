<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEMP — Experience Prototype (v0.3) · fractal spine</title>
<link rel="stylesheet" href="../tokens.css">
<style>
/* ============================================================================
   PEMP prototype — the FRACTAL SPINE.
   Master spine = the engagement story (persistent, top).
   Each tab carries its own sub-spine for that stage's sub-tasks.
   The two levels lock together: signing the SoW advances the master spine AND
   unlocks the next tab's sub-flow.  DESIGN_PLAN v0.3 §1.1, §4, §8, §10.
   ============================================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans); background:var(--canvas); color:var(--ink);
  font-size:var(--text-base); line-height:1.5; -webkit-font-smoothing:antialiased;
  display:grid; grid-template-columns:240px 1fr; grid-template-rows:auto 1fr;
  grid-template-areas:"brand topbar" "nav main"; height:100vh; overflow:hidden;
  transition:background var(--dur-base) var(--ease-standard), color var(--dur-base) var(--ease-standard);
}
.mono{font-family:var(--font-mono)} .muted{color:var(--ink-muted)}

/* ---------- Brand cell ---------- */
.brandcell{grid-area:brand; background:var(--surface); border-right:1px solid var(--border); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; padding:0 var(--space-4)}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-glow));
  box-shadow:var(--brand-glow-sh); display:grid;place-items:center; font-weight:800;color:var(--brand-ink)}
.brandcell b{font-size:var(--text-lg);letter-spacing:.3px}

/* ---------- Topbar: engagement context + master spine ---------- */
.topbar{grid-area:topbar; background:var(--surface); border-bottom:1px solid var(--border);
  padding:10px var(--space-8); display:flex; flex-direction:column; gap:8px; justify-content:center}
.engrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--text-sm)}
.engrow .name{font-weight:700;font-size:var(--text-base)}
.chip{font-size:var(--text-xs);font-weight:650;padding:2px 9px;border-radius:var(--radius-pill);border:1px solid var(--border)}
.chip.project{color:var(--brand-glow);border-color:color-mix(in srgb,var(--brand) 50%,transparent);background:var(--brand-soft)}
.chip.crit{color:var(--sev-high);border-color:color-mix(in srgb,var(--sev-high) 40%,transparent)}
.kbd{margin-left:auto;font-size:var(--text-xs);color:var(--ink-muted);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px 8px}
.themebtn{font-size:var(--text-xs);color:var(--ink-muted);border:1px solid var(--border);border-radius:var(--radius-pill);padding:4px 10px;cursor:pointer}
.themebtn:hover{color:var(--ink);border-color:var(--border-strong)}

/* ---------- Spine (shared by master + sub) ---------- */
.spine{display:flex;align-items:flex-start;overflow-x:auto;gap:0}
.spine.master{padding:2px 0}
.spine.sub{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-6) var(--space-4);margin-bottom:var(--space-6)}
.node{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:74px;position:relative}
.spine.master .node{min-width:84px}
.node .bead{width:16px;height:16px;border-radius:50%;z-index:2;border:2px solid var(--border-strong);
  background:var(--canvas);display:grid;place-items:center;font-size:9px;color:var(--ink-muted);
  transition:all var(--dur-ceremony) var(--ease-emphasis); cursor:default}
.spine.master .node .bead{width:18px;height:18px}
.node.nav .bead{cursor:pointer}
.node.done .bead{background:var(--state-done);border-color:var(--state-done);color:var(--canvas)}
.node.current .bead{background:var(--brand);border-color:var(--brand-glow);box-shadow:var(--brand-glow-sh);animation:pulse 2s infinite}
.node.locked .bead{background:var(--surface-raised);border-color:var(--state-locked);color:var(--state-locked)}
.node.future .bead{opacity:.5}
.node .lbl{font-size:10.5px;color:var(--ink-muted);text-align:center;line-height:1.25;max-width:84px}
.node.current .lbl,.node.done .lbl{color:var(--ink)}
.node.nav:hover .lbl{color:var(--brand-glow)}
.node .connector{position:absolute;top:8px;left:50%;width:100%;height:2px;background:var(--border-strong);z-index:1}
.spine.master .node .connector{top:9px}
.node.done .connector{background:var(--state-done)}
.node:last-child .connector{display:none}
.node.justunlocked .bead{animation:unlock var(--dur-ceremony) var(--ease-emphasis)}
@keyframes pulse{0%,100%{box-shadow:var(--brand-glow-sh)}50%{box-shadow:0 0 0 1px var(--brand),0 0 8px rgba(91,141,239,.25)}}
@keyframes unlock{0%{transform:scale(.55)}60%{transform:scale(1.28)}100%{transform:scale(1)}}

/* ---------- Sidebar nav: each tab shows its own sub-flow progress ---------- */
nav{grid-area:nav;background:var(--surface);border-right:1px solid var(--border);padding:var(--space-3);display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.navtab{padding:9px 11px;border-radius:var(--radius-md);cursor:pointer;user-select:none;border:1px solid transparent;transition:all var(--dur-fast) var(--ease-standard)}
.navtab:hover{background:var(--surface-raised)}
.navtab.active{background:var(--brand-soft);border-color:var(--border-strong)}
.navtab .top{display:flex;align-items:center;gap:9px;font-size:var(--text-sm);color:var(--ink-muted)}
.navtab.active .top,.navtab:hover .top{color:var(--ink)}
.navtab .ico{width:18px;text-align:center}
.navtab .count{margin-left:auto;font-size:11px;color:var(--ink-muted)}
.navtab.lockedtab .ico{opacity:.6}
.subbar{height:3px;border-radius:2px;background:var(--border);margin:7px 2px 0;overflow:hidden}
.subbar i{display:block;height:100%;background:linear-gradient(90deg,var(--state-done),var(--brand));width:0;transition:width var(--dur-ceremony) var(--ease-emphasis)}
.navtab.lockedtab .subbar i{background:var(--state-locked)}
.navfoot{margin-top:auto;padding:10px 11px;font-size:11px;color:var(--ink-muted)}

/* ---------- Main ---------- */
main{grid-area:main;overflow-y:auto;padding:var(--space-8) var(--space-12)}
.screen{display:none;max-width:1080px;animation:fadein var(--dur-base) var(--ease-standard)}
.screen.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:var(--text-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
h1.title{font-size:var(--text-2xl);font-weight:750;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--ink-muted);margin-bottom:var(--space-6)}
.sectionlabel{font-size:var(--text-sm);font-weight:650;color:var(--ink-muted);margin:var(--space-6) 0 var(--space-3);display:flex;gap:8px;align-items:center}
.srs{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1px 6px}

/* ---------- cards / buttons ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-6)}
.nextaction{display:flex;align-items:center;gap:var(--space-4);border:1px solid var(--border-strong);margin-bottom:var(--space-4)}
.nextaction .meta{flex:1} .nextaction .meta b{display:block;font-size:var(--text-lg)}
.lockline{display:flex;align-items:center;gap:8px;color:var(--state-locked);font-size:var(--text-sm);margin-top:6px}
.btn{font-family:inherit;font-size:var(--text-sm);font-weight:650;border-radius:var(--radius-pill);padding:8px 16px;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--surface-raised);color:var(--ink);transition:all var(--dur-fast) var(--ease-standard);white-space:nowrap}
.btn:hover{border-color:var(--ink-muted)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{box-shadow:var(--brand-glow-sh)}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.lockbanner{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius-md);padding:12px var(--space-4);color:var(--state-locked);font-size:var(--text-sm);margin-bottom:var(--space-4)}

/* ---------- My-Turn rows ---------- */
.pile{display:flex;flex-direction:column;gap:var(--space-2)}
.row{display:flex;align-items:center;gap:var(--space-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:13px var(--space-4);transition:all var(--dur-fast) var(--ease-standard)}
.row.actionable:hover{border-color:var(--border-strong);transform:translateX(2px);box-shadow:var(--elev-raised)}
.row.waiting{opacity:.75}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.crit{background:var(--sev-critical)}.dot.high{background:var(--sev-high)}.dot.med{background:var(--sev-medium)}.dot.low{background:var(--sev-low)}
.row .grow{flex:1;min-width:0}.row .verb{font-weight:600}.row .ref{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--ink-muted)}
.sla{font-family:var(--font-mono);font-size:var(--text-xs);padding:3px 8px;border-radius:var(--radius-pill);border:1px solid var(--border)}
.sla.green{color:var(--state-done);border-color:color-mix(in srgb,var(--state-done) 40%,transparent)}
.sla.amber{color:var(--state-waiting);border-color:color-mix(in srgb,var(--state-waiting) 40%,transparent)}
.sla.red{color:var(--state-blocked);border-color:color-mix(in srgb,var(--state-blocked) 40%,transparent)}
.nudge{font-size:var(--text-xs);color:var(--ink-muted);border:1px solid var(--border);border-radius:var(--radius-pill);padding:4px 10px}
.empty{text-align:center;color:var(--ink-muted);padding:var(--space-8);border:1px dashed var(--border);border-radius:var(--radius-lg);margin-top:var(--space-3)}
.empty b{color:var(--ink)}

/* ---------- forms / meter ---------- */
.meter{height:8px;border-radius:var(--radius-pill);background:var(--surface-raised);overflow:hidden;margin:6px 0 14px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-glow))}
.q{padding:10px 0;border-bottom:1px solid var(--border)}
.q label{display:inline-flex;gap:6px;align-items:center;margin-right:16px;font-size:var(--text-sm)}
.pill{font-size:var(--text-xs);padding:2px 9px;border-radius:var(--radius-pill);border:1px solid var(--border)}
.pill.done{color:var(--state-done)} .pill.open{color:var(--state-blocked)} .pill.retest{color:var(--state-waiting)}
.pill.remediated{color:var(--brand-glow)} .pill.closed{color:var(--state-done)}

/* ---------- register table ---------- */
table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
th{text-align:left;color:var(--ink-muted);font-weight:600;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:11px 10px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface-raised)}
.sevchip{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:700;padding:2px 8px;border-radius:var(--radius-sm)}
.sevchip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sevchip.crit{color:var(--sev-critical)}.sevchip.high{color:var(--sev-high)}.sevchip.med{color:var(--sev-medium)}.sevchip.low{color:var(--sev-low)}
.maskfield{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:var(--text-sm);background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px var(--space-4)}

/* ---------- gate ceremony ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,7,14,.66);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50}
.scrim.show{display:grid;animation:fadein var(--dur-base)}
.modal{width:470px;max-width:92vw;background:var(--surface-modal);border:1px solid var(--border-strong);border-radius:var(--radius-lg);box-shadow:var(--elev-modal);padding:var(--space-8);animation:rise var(--dur-base) var(--ease-emphasis)}
@keyframes rise{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:var(--text-xl);margin-bottom:var(--space-4)}
.attest{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-4);margin-bottom:var(--space-4)}
.attest li{list-style:none;padding:4px 0;display:flex;gap:8px}.attest li::before{content:"•";color:var(--brand)}
.chainline{display:flex;align-items:center;gap:8px;font-size:var(--text-sm);color:var(--ink-muted);margin-bottom:var(--space-6)}
.tick{color:var(--state-done)} .modal .actions{display:flex;gap:var(--space-3);justify-content:flex-end}
.reauth{text-align:center;padding:var(--space-6) 0}.reauth .key{font-size:40px}
.toast{position:fixed;bottom:var(--space-8);left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-modal);border:1px solid var(--state-done);color:var(--ink);padding:12px 20px;border-radius:var(--radius-pill);box-shadow:var(--elev-modal);opacity:0;pointer-events:none;transition:all var(--dur-base) var(--ease-emphasis);z-index:60;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="brandcell"><div class="logo">P</div><b>PEMP</b></div>

<header class="topbar">
  <div class="engrow">
    <span class="eyebrow">Engagement</span>
    <span class="name">Claims Portal</span>
    <span class="ref mono muted">ENG-2026-0412</span>
    <span class="chip project">PROJECT</span>
    <span class="chip crit">High</span>
    <span class="kbd">⌘K</span>
    <span class="themebtn" id="themeBtn">◐ Theme</span>
  </div>
  <div class="spine master" id="masterSpine"></div>
</header>

<nav id="nav"></nav>

<main id="main"></main>

<div class="scrim" id="gate"><div class="modal" id="gateModal"></div></div>
<div class="toast" id="toast"><span class="tick">🔗✓</span> <span id="toastMsg"></span></div>

<script>
/* ============================ STATE (data-driven) ============================ */
// Master spine = the engagement story. Some stages map to a tab (click-through).
let master = [
  {k:'intake',  l:'Intake',   s:'done'},
  {k:'assign',  l:'Assign',   s:'done'},
  {k:'scope',   l:'Scope',    s:'done',    tab:'assessment'},
  {k:'sow',     l:'SoW',      s:'current', tab:'sow'},
  {k:'access',  l:'Access',   s:'locked',  tab:'access'},
  {k:'test',    l:'Test',     s:'locked'},
  {k:'findings',l:'Findings', s:'locked',  tab:'findings'},
  {k:'report',  l:'Report',   s:'locked',  tab:'reports'},
  {k:'retest',  l:'Retest',   s:'locked'},
];

// Each tab carries its OWN sub-spine — the fractal pattern.
let tabs = {
  mywork:    {icon:'◧', label:'My Work',   locked:false, flow:[
    {l:'Triage', s:'done'},{l:'Act', s:'current'},{l:'Clear', s:'future'}]},
  assessment:{icon:'✎', label:'Assessment',locked:false, flow:[
    {l:'Auth', s:'done'},{l:'Data', s:'done'},{l:'API', s:'done'},{l:'Infra', s:'done'},{l:'Confirm', s:'done'}]},
  sow:       {icon:'📄', label:'SoW',       locked:false, flow:[
    {l:'Draft', s:'done'},{l:'DM review', s:'done'},{l:'Acme sign', s:'current'},{l:'Signed', s:'future'}]},
  access:    {icon:'🔑', label:'Access',    locked:true,  flow:[
    {l:'Define prereqs', s:'locked'},{l:'Provision', s:'locked'},{l:'Credentials', s:'locked'},{l:'Verify', s:'locked'}]},
  findings:  {icon:'🐞', label:'Findings',  locked:true,  flow:[
    {l:'Capture', s:'locked'},{l:'CVSS', s:'locked'},{l:'Register', s:'locked'},{l:'Peer-ready', s:'locked'}]},
  reports:   {icon:'⚑', label:'Reports',   locked:true,  flow:[
    {l:'Assemble', s:'locked'},{l:'Draft', s:'locked'},{l:'Peer QA', s:'locked'},{l:'Release', s:'locked'}]},
};
const ORDER = ['mywork','assessment','sow','access','findings','reports'];
let activeTab = 'mywork';

/* ============================ RENDER ============================ */
function beadGlyph(s){ return s==='done'?'✓' : s==='locked'?'🔒' : ''; }

function renderSpine(el, nodes, nav){
  el.innerHTML = nodes.map(n=>{
    const cls = ['node', n.s, (nav&&n.tab)?'nav':''].join(' ');
    const data = n.tab ? `data-tab="${n.tab}"` : '';
    return `<div class="${cls}" ${data}><div class="connector"></div>
      <div class="bead">${beadGlyph(n.s)}</div><div class="lbl">${n.l}</div></div>`;
  }).join('');
  if(nav) el.querySelectorAll('.node.nav').forEach(node=> node.onclick=()=>go(node.dataset.tab));
}

function pct(flow){ const d=flow.filter(f=>f.s==='done').length; return Math.round(100*d/flow.length); }

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = ORDER.map(k=>{
    const t=tabs[k], p=pct(t.flow), active=k===activeTab;
    const count = k==='mywork' ? '<span class="count">3</span>'
                : t.locked ? '<span class="count">🔒</span>'
                : `<span class="count">${p}%</span>`;
    return `<div class="navtab ${active?'active':''} ${t.locked?'lockedtab':''}" data-tab="${k}">
      <div class="top"><span class="ico">${t.icon}</span> ${t.label} ${count}</div>
      <div class="subbar"><i style="width:${t.locked?6:p}%"></i></div>
    </div>`;
  }).join('') + `<div class="navfoot">Penetration Tester · A. Khan</div>`;
  nav.querySelectorAll('.navtab').forEach(n=> n.onclick=()=>go(n.dataset.tab));
}

/* ---- per-tab body content ---- */
function nextCard(title, owner, srs, locked, btn, onclick){
  return `<div class="card nextaction">
    <div style="font-size:26px">${locked?'🔒':'▸'}</div>
    <div class="meta"><b>${title}</b><span class="muted">${owner} · <span class="srs">${srs}</span></span>
    ${locked?'<div class="lockline">Unlocks when the SoW is signed</div>':''}</div>
    ${btn?`<button class="btn primary" onclick="${onclick}">${btn}</button>`:''}</div>`;
}

function bodyFor(k){
  const t=tabs[k];
  if(k==='mywork') return `
    <div class="eyebrow">Home · My Turn</div><h1 class="title">Good morning, Asha.</h1>
    <p class="sub">Two things need you. Three engagements move without you.</p>
    <div class="sectionlabel">▸ Your turn <span class="srs">FR-NOT-01</span></div>
    <div class="pile">
      ${rowHtml('high','Sign the Statement of Work','Claims Portal','ENG-2026-0412','amber','⏱ 2d','Review & Sign ▶',"go('sow')")}
      ${rowHtml('med','Verify access','Payments API','ENG-2026-0419','green','⏱ 4d','Verify access ▶',"go('access')")}
      ${rowHtml('crit','Add findings to draft report','Retail Web','ENG-2026-0408','red','⏱ overdue','Open findings ▶',"go('findings')")}
    </div>
    <div class="sectionlabel">Waiting on others <span class="srs">FR-NOT-03</span></div>
    <div class="pile">
      ${waitHtml('low','Awaiting Acme sign-off','Broker Portal','ENG-2026-0415 · with J. Okafor · 1d')}
      ${waitHtml('med','Access ticket pending','Mobile App','ENG-2026-0421 · INC-8821 · 5d')}
    </div>
    <div class="empty">You're all clear after these. <b>3 engagements moving without you.</b><br>
      <span style="font-size:var(--text-xs)">Calm. Genuine. No confetti. — §9</span></div>`;

  if(k==='assessment') return tabHead('Assessment','Two-lens questionnaire — completed and confirmed.')+
    nextCard('Assessment confirmed · 100%','Owner: You (Pentester)','FR-SCO-03',false,'',null)+
    `<div class="card"><div class="sectionlabel" style="margin-top:0">Completeness <span class="srs">FR-SCO-03</span></div>
      <div class="meter"><i style="width:100%"></i></div>
      <div class="q"><b>Authentication</b> — Uses SSO? <span class="pill done">Yes ✓</span></div>
      <div class="q"><b>Data handling</b> — PII processed? <span class="pill done">Confirmed ✓</span></div>
      <div class="q"><b>API</b> — Rate-limit thresholds <span class="pill done">Captured ✓</span></div>
      <div class="q" style="border:none"><b>Infrastructure</b> — Out-of-scope hosts <span class="pill done">Listed ✓</span></div>
      <p class="muted" style="margin-top:10px;font-size:var(--text-sm)">Prefilled from ENG-2025-0331 · <span class="srs">FR-SCO-04</span></p></div>`;

  if(k==='sow') return tabHead('Statement of Work','Auto-drafted from the assessment — sign to unlock testing.')+
    nextCard('Sign the Statement of Work','Owner: You (issuing to Acme)','FR-SOW-06',false,'Review & Sign SoW ▶','openGate()')+
    `<div class="card"><div class="sectionlabel" style="margin-top:0">Draft v3 <span class="srs">FR-SOW-01</span></div>
      <p><b>1. Scope:</b> Claims Portal web + API · <b>2. Methodology:</b> OWASP ASVS<br>
      <b>3. Dates:</b> 14–25 Jul 2026 · <b>4. Prerequisites:</b> 3 test accounts, VPN</p>
      <p class="muted" style="margin-top:8px;font-size:var(--text-sm)">Versions: v1 · v2 · <b style="color:var(--ink)">▸v3</b> &nbsp;<span class="srs">FR-SOW-02</span></p>
      <div class="lockline" id="sowLock">🔒 Testing stays locked until signed &nbsp;<span class="srs">FR-SOW-06</span></div></div>`;

  if(k==='access') return tabHead('Access & Prerequisites', t.locked?'Locked — this stage opens once the SoW is signed.':'Confirm access before testing begins.')+
    (t.locked?`<div class="lockbanner">🔒 This tab unlocks when the SoW is signed. Its sub-flow is shown ghosted above.</div>`:'')+
    nextCard('Verify access works','Owner: You (Pentester)','FR-ACC-04',t.locked,t.locked?'':'Verify access ▶',t.locked?'':'verifyAccess()')+
    `<div class="card"><div class="sectionlabel" style="margin-top:0">Prerequisite checklist <span class="srs">FR-ACC-01/02</span></div>
      <div class="q">● Test account A <span class="pill done">provisioned ✓</span></div>
      <div class="q">◑ Test account B <span class="pill retest">ticket INC-8821</span></div>
      <div class="q" style="border:none">○ VPN profile <span class="pill open">not requested</span></div>
      <div class="sectionlabel">Vault-backed credential <span class="srs">SEC-CRD-01</span></div>
      <div class="maskfield">user: svc_pentest_a &nbsp; pass: ••••••••
        <button class="btn ghost" style="margin-left:auto" ${t.locked?'disabled':''}>Reveal 🔓</button></div>
      <p class="muted" style="margin-top:8px;font-size:var(--text-sm)">reveal = re-auth + logged · auto-revoke 26 Jul · <span class="srs">SEC-CRD-02/03</span></p></div>`;

  if(k==='findings') return tabHead('Findings · Live Register', t.locked?'Locked — opens when testing begins.':'Enter once; flows live into the register.')+
    (t.locked?`<div class="lockbanner">🔒 This tab unlocks after access is verified and testing starts. Sub-flow ghosted above.</div>`:'')+
    `<div class="card" style="padding:0;overflow:hidden;${t.locked?'opacity:.55':''}">
      <table><thead><tr><th>Severity</th><th>Finding</th><th>Asset</th><th>CVSS</th><th>Status</th></tr></thead><tbody>
      <tr><td><span class="sevchip crit">Critical</span></td><td>Auth bypass via JWT confusion</td><td>API</td><td class="mono">9.1</td><td><span class="pill open">open</span></td></tr>
      <tr><td><span class="sevchip high">High</span></td><td>SQLi in /claims search</td><td>Web</td><td class="mono">8.1</td><td><span class="pill retest">retest-pending</span></td></tr>
      <tr><td><span class="sevchip high">High</span></td><td>Stored XSS in note field</td><td>Web</td><td class="mono">7.4</td><td><span class="pill open">open</span></td></tr>
      <tr><td><span class="sevchip med">Medium</span></td><td>Verbose error disclosure</td><td>API</td><td class="mono">5.3</td><td><span class="pill remediated">remediated</span></td></tr>
      <tr><td><span class="sevchip low">Low</span></td><td>Missing cookie flags</td><td>Web</td><td class="mono">3.1</td><td><span class="pill closed">closed</span></td></tr>
      </tbody></table></div>
      <p class="muted" style="margin-top:10px;font-size:var(--text-xs)"><span class="srs">FR-FND-01</span> fixed 5-step scale, never colour alone · <span class="srs">FR-FND-03</span> enter once → live register</p>`;

  if(k==='reports') return tabHead('Reporting', t.locked?'Locked — opens when findings are drafted.':'Assemble, peer-review, release.')+
    (t.locked?`<div class="lockbanner">🔒 This tab unlocks once findings exist to draft. Sub-flow ghosted above.</div>`:'')+
    nextCard('Release final report','Owner: You → peer → Acme','FR-REP-02',t.locked,t.locked?'':'Release ▶',t.locked?'':'openGate()')+
    `<div class="card" style="${t.locked?'opacity:.55':''}"><div class="sectionlabel" style="margin-top:0">Assembled from engagement + findings <span class="srs">FR-REP-01</span></div>
      <p>Exec summary · 7 findings · register snapshot · appendix</p>
      <div class="lockline">🔒 QA GATE: peer review required before release <span class="srs">FR-REP-02</span></div></div>`;
  return '';
}
function tabHead(t,s){ return `<div class="eyebrow">Engagement · ${t}</div><h1 class="title">${t}</h1><p class="sub">${s}</p>`; }
function rowHtml(dot,verb,target,ref,slaCls,sla,btn,onclick){
  return `<div class="row actionable"><span class="dot ${dot}"></span>
    <div class="grow"><span class="verb">${verb}</span> · ${target}<br><span class="ref">${ref}</span></div>
    <span class="sla ${slaCls}">${sla}</span><button class="btn primary" onclick="${onclick}">${btn}</button></div>`;
}
function waitHtml(dot,verb,target,meta){
  return `<div class="row waiting"><span class="dot ${dot}"></span>
    <div class="grow"><span class="verb">${verb}</span> · ${target}<br><span class="ref">${meta}</span></div>
    <span class="nudge">Nudge</span></div>`;
}

/* ---- compose a screen: sub-spine + body ---- */
function renderMain(){
  const t=tabs[activeTab];
  const showSub = activeTab!=='mywork';
  document.getElementById('main').innerHTML =
    `<section class="screen active">${
      showSub ? `<div class="spine sub" id="subSpine"></div>` : ''
    }${bodyFor(activeTab)}</section>`;
  if(showSub) renderSpine(document.getElementById('subSpine'), t.flow, false);
}

function go(k){
  if(!tabs[k]) return;
  activeTab=k; renderNav(); renderMain();
  document.getElementById('main').scrollTo({top:0});
}

/* ============================ GATE CEREMONY ============================ */
const gate=document.getElementById('gate'), modal=document.getElementById('gateModal');
function openGate(){ gate.classList.add('show'); frameAttest(); }
function closeGate(){ gate.classList.remove('show'); }
gate.onclick=e=>{ if(e.target===gate) closeGate(); };
function frameAttest(){ modal.innerHTML=`<h3>Sign Statement of Work</h3>
  <p class="muted" style="margin-bottom:12px">You are agreeing to:</p>
  <ul class="attest"><li>Scope: Claims Portal web + API</li><li>Dates: 14–25 Jul 2026</li><li>Prerequisites: 3 test accounts, VPN</li></ul>
  <div class="chainline"><span class="tick">🔗</span> This creates an immutable, hash-chained record &nbsp;<span class="srs">SEC-AUD-01</span></div>
  <div class="actions"><button class="btn ghost" onclick="closeGate()">Cancel</button><button class="btn primary" onclick="frameReauth()">Confirm sign</button></div>`; }
function frameReauth(){ modal.innerHTML=`<h3>Confirm it's you</h3>
  <div class="reauth"><div class="key">🔐</div><p class="muted">Re-authenticate via Entra MFA for this privileged action.<br><span class="srs">SEC-IAM-04</span></p></div>
  <div class="actions"><button class="btn ghost" onclick="closeGate()">Cancel</button><button class="btn primary" onclick="frameCommit()">Verify with Entra ▶</button></div>`; }
function frameCommit(){ modal.innerHTML=`<h3>Signing…</h3>
  <div class="reauth"><div class="key" style="animation:pulse 1s infinite">✍️</div>
  <p class="muted">1) signed record · 2) hash-chain append · 3) state transition #5</p></div>`;
  setTimeout(payoffSign, 900); }

/* The fractal payoff: advance BOTH the master spine AND the next tab's sub-flow */
function payoffSign(){
  closeGate();
  // master spine: SoW done, Access current
  master.find(n=>n.k==='sow').s='done';
  master.find(n=>n.k==='access').s='current';
  // SoW tab sub-flow completes
  tabs.sow.flow.forEach(f=>f.s='done');
  // Access tab unlocks; its sub-flow activates
  tabs.access.locked=false;
  tabs.access.flow=[{l:'Define prereqs',s:'done'},{l:'Provision',s:'current'},{l:'Credentials',s:'future'},{l:'Verify',s:'future'}];
  renderSpine(document.getElementById('masterSpine'), master, true);
  // glow the newly-unlocked master node
  const accNode=[...document.querySelectorAll('#masterSpine .node')].find(n=>n.dataset.tab==='access');
  if(accNode) accNode.classList.add('justunlocked');
  renderNav();
  if(activeTab==='sow'){ activeTab='access'; renderNav(); }
  renderMain();
  toast('SoW signed. Testing unlocked.');
}
function verifyAccess(){
  tabs.access.flow=[{l:'Define prereqs',s:'done'},{l:'Provision',s:'done'},{l:'Credentials',s:'done'},{l:'Verify',s:'done'}];
  master.find(n=>n.k==='access').s='done';
  master.find(n=>n.k==='test').s='current';
  tabs.findings.locked=false;
  tabs.findings.flow=[{l:'Capture',s:'current'},{l:'CVSS',s:'future'},{l:'Register',s:'future'},{l:'Peer-ready',s:'future'}];
  renderSpine(document.getElementById('masterSpine'), master, true);
  renderNav(); renderMain(); toast('Access verified. Test window open.');
}
function toast(msg){ const t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=msg;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

/* ============================ INIT ============================ */
document.getElementById('themeBtn').onclick=()=>{ const h=document.documentElement; h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'; };
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();alert('⌘K command palette — DESIGN_PLAN §13');} if(e.key==='Escape')closeGate(); });
renderSpine(document.getElementById('masterSpine'), master, true);
renderNav(); renderMain();
</script>
