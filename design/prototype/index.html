<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEMP — Experience Prototype (v0.3) · all roles · fractal spine</title>
<link rel="stylesheet" href="../tokens.css">
<style>
/* ============================================================================
   PEMP prototype — all 5 roles, the fractal spine, ⌘K palette, admin & analytics.
   Data-driven: roles → tabs → sub-spines render from one model.
   DESIGN_PLAN v0.3.
   Signature-look pass 1: ambient canvas depth, luminous primary-action card,
   tinted status chips (colour-on-status discipline kept), tile hover lift.
   Pass 2: inline sparklines in dashboard tiles.
   Pass 3: right slide-over drawer rail (Documents/Findings/Comms/Audit, §4).
   Pass 4: responsive tablet/phone layout (NFR-USA-04) — desktop untouched.
   Pass 5: real engagement cards with mini-spine (kit #2) for list views.
   Pass 6: skeleton loading on async report generation (NFR-PER-03).
   Pass 7: capacity-board Mon–Fri load heatmap (FR-ASG-04).
   ============================================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);color:var(--ink);font-size:var(--text-base);line-height:1.5;
  -webkit-font-smoothing:antialiased;display:grid;grid-template-columns:244px 1fr;grid-template-rows:auto 1fr;
  grid-template-areas:"brand topbar" "nav main";height:100vh;overflow:hidden;
  /* ambient depth: two faint brand glows over the canvas — the "art-piece" calm (§2.1) */
  background:
    radial-gradient(1100px 560px at 2% -12%, color-mix(in srgb,var(--brand) 10%,transparent), transparent 60%),
    radial-gradient(900px 520px at 102% -4%, color-mix(in srgb,var(--brand-glow) 7%,transparent), transparent 55%),
    var(--canvas);
  background-attachment:fixed;
  transition:background var(--dur-base),color var(--dur-base)}
.mono{font-family:var(--font-mono)}.muted{color:var(--ink-muted)}
/* a11y: visible focus + screen-reader-only text */
:focus-visible{outline:2px solid var(--brand-glow);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){
  .node.current .bead,.node.justunlocked .bead,.reauth .key{animation:none!important}
}

.brandcell{grid-area:brand;background:var(--surface);border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 var(--space-4)}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-glow));
  box-shadow:var(--brand-glow-sh);display:grid;place-items:center;font-weight:800;color:var(--brand-ink)}
.brandcell b{font-size:var(--text-lg);letter-spacing:.3px}

.topbar{grid-area:topbar;background:var(--surface);border-bottom:1px solid var(--border);
  padding:9px var(--space-8);display:flex;flex-direction:column;gap:7px;justify-content:center}
.engrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--text-sm)}
.engrow .name{font-weight:700;font-size:var(--text-base)}
.chip{font-size:var(--text-xs);font-weight:650;padding:2px 9px;border-radius:var(--radius-pill);border:1px solid var(--border)}
.chip.project{color:var(--brand-glow);border-color:color-mix(in srgb,var(--brand) 50%,transparent);background:var(--brand-soft)}
.chip.crit{color:var(--sev-high);border-color:color-mix(in srgb,var(--sev-high) 40%,transparent)}
.spacer{margin-left:auto}
.rolesel{background:var(--surface-raised);color:var(--ink);border:1px solid var(--border-strong);border-radius:var(--radius-pill);
  padding:5px 12px;font-family:inherit;font-size:var(--text-xs);cursor:pointer}
.kbd{font-size:var(--text-xs);color:var(--ink-muted);background:var(--surface);font-family:inherit;border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px 8px;cursor:pointer}
.kbd:hover{color:var(--ink);border-color:var(--border-strong)}

/* spine (master + sub share this) */
.spine{display:flex;align-items:flex-start;overflow-x:auto;gap:0}
.spine.sub{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-6) var(--space-4);margin-bottom:var(--space-6)}
.node{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:74px;position:relative}
.spine.master .node{min-width:84px}
.node .bead{width:16px;height:16px;border-radius:50%;z-index:2;border:2px solid var(--border-strong);background:var(--canvas);
  display:grid;place-items:center;font-size:9px;color:var(--ink-muted);transition:all var(--dur-ceremony) var(--ease-emphasis)}
.spine.master .node .bead{width:18px;height:18px}
.node.nav .bead{cursor:pointer}
.node.done .bead{background:var(--state-done);border-color:var(--state-done);color:var(--canvas)}
.node.current .bead{background:var(--brand);border-color:var(--brand-glow);box-shadow:var(--brand-glow-sh);animation:pulse 2s infinite}
.node.locked .bead{background:var(--surface-raised);border-color:var(--state-locked);color:var(--state-locked)}
.node.future .bead{opacity:.5}
.node .lbl{font-size:10.5px;color:var(--ink-muted);text-align:center;line-height:1.25;max-width:84px}
.node.current .lbl,.node.done .lbl{color:var(--ink)}
.node.nav:hover .lbl{color:var(--brand-glow)}
.node .connector{position:absolute;top:8px;left:50%;width:100%;height:2px;background:var(--border-strong);z-index:1}
.spine.master .node .connector{top:9px}
.node.done .connector{background:var(--state-done)}
.node:last-child .connector{display:none}
.node.justunlocked .bead{animation:unlock var(--dur-ceremony) var(--ease-emphasis)}
@keyframes pulse{0%,100%{box-shadow:var(--brand-glow-sh)}50%{box-shadow:0 0 0 1px var(--brand),0 0 8px rgba(91,141,239,.25)}}
@keyframes unlock{0%{transform:scale(.55)}60%{transform:scale(1.28)}100%{transform:scale(1)}}

/* nav */
nav{grid-area:nav;background:var(--surface);border-right:1px solid var(--border);padding:var(--space-3);display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.navtab{padding:9px 11px;border-radius:var(--radius-md);cursor:pointer;user-select:none;border:1px solid transparent;transition:all var(--dur-fast)}
.navtab:hover{background:var(--surface-raised)}
.navtab.active{background:var(--brand-soft);border-color:var(--border-strong)}
.navtab .top{display:flex;align-items:center;gap:9px;font-size:var(--text-sm);color:var(--ink-muted)}
.navtab.active .top,.navtab:hover .top{color:var(--ink)}
.navtab .ico{width:18px;text-align:center}.navtab .count{margin-left:auto;font-size:11px;color:var(--ink-muted)}
.navtab.lockedtab .ico{opacity:.6}
.subbar{height:3px;border-radius:2px;background:var(--border);margin:7px 2px 0;overflow:hidden}
.subbar i{display:block;height:100%;background:linear-gradient(90deg,var(--state-done),var(--brand));width:0;transition:width var(--dur-ceremony) var(--ease-emphasis)}
.navtab.lockedtab .subbar i{background:var(--state-locked)}
.navfoot{margin-top:auto;padding:10px 11px;font-size:11px;color:var(--ink-muted)}

main{grid-area:main;overflow-y:auto;padding:var(--space-8) var(--space-12)}
.screen{max-width:1080px;animation:fadein var(--dur-base)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:var(--text-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
h1.title{font-size:var(--text-2xl);font-weight:750;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--ink-muted);margin-bottom:var(--space-6)}
.sectionlabel{font-size:var(--text-sm);font-weight:650;color:var(--ink-muted);margin:var(--space-6) 0 var(--space-3);display:flex;gap:8px;align-items:center}
.srs{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1px 6px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-6)}
/* the one primary action — the single "bright thing to press" (§1.3/§2.1): luminous accent + soft glow */
.nextaction{display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-4);position:relative;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--brand) 36%,var(--border-strong));
  background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 7%,var(--surface)),var(--surface));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--brand) 16%,transparent),0 10px 26px -14px color-mix(in srgb,var(--brand) 60%,transparent)}
.nextaction::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--brand),var(--brand-glow))}
.nextaction .meta{flex:1}.nextaction .meta b{display:block;font-size:var(--text-lg)}
.lockline{display:flex;align-items:center;gap:8px;color:var(--state-locked);font-size:var(--text-sm);margin-top:6px}
.btn{font-family:inherit;font-size:var(--text-sm);font-weight:650;border-radius:var(--radius-pill);padding:8px 16px;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--surface-raised);color:var(--ink);transition:all var(--dur-fast);white-space:nowrap}
.btn:hover{border-color:var(--ink-muted)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{box-shadow:var(--brand-glow-sh)}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.lockbanner{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius-md);padding:12px var(--space-4);color:var(--state-locked);font-size:var(--text-sm);margin-bottom:var(--space-4)}

/* inbox rows */
.pile{display:flex;flex-direction:column;gap:var(--space-2)}
.row{display:flex;align-items:center;gap:var(--space-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:13px var(--space-4);transition:all var(--dur-fast)}
.row.actionable:hover{border-color:var(--border-strong);transform:translateX(2px);box-shadow:var(--elev-raised)}
.row.waiting{opacity:.75}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.crit{background:var(--sev-critical)}.dot.high{background:var(--sev-high)}.dot.med{background:var(--sev-medium)}.dot.low{background:var(--sev-low)}
.row .grow{flex:1;min-width:0}.row .verb{font-weight:600}.row .ref{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--ink-muted)}
.sla{font-family:var(--font-mono);font-size:var(--text-xs);padding:3px 8px;border-radius:var(--radius-pill);border:1px solid var(--border)}
.sla.green{color:var(--state-done);border-color:color-mix(in srgb,var(--state-done) 40%,transparent)}
.sla.amber{color:var(--state-waiting);border-color:color-mix(in srgb,var(--state-waiting) 40%,transparent)}
.sla.red{color:var(--state-blocked);border-color:color-mix(in srgb,var(--state-blocked) 40%,transparent)}
.sla.green,.sla.amber,.sla.red{background:color-mix(in srgb,currentColor 11%,transparent)}
.nudge{font-size:var(--text-xs);color:var(--ink-muted);border:1px solid var(--border);border-radius:var(--radius-pill);padding:4px 10px}
.empty{text-align:center;color:var(--ink-muted);padding:var(--space-8);border:1px dashed var(--border);border-radius:var(--radius-lg);margin-top:var(--space-3)}
.empty b{color:var(--ink)}

/* engagement cards (kit #2) — list/grid unit with mini-spine */
.enggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:var(--space-3)}
.engcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-4);cursor:pointer;
  transition:transform var(--dur-fast),border-color var(--dur-fast),box-shadow var(--dur-fast)}
.engcard:hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:var(--elev-raised)}
.engcard .top{display:flex;align-items:center;gap:8px}
.engcard .nm{font-weight:700}
.engcard .rf{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--ink-muted);margin-top:2px}
.engcard .foot{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:var(--text-sm);color:var(--ink-muted)}
.minispine{display:flex;align-items:center;margin-top:12px}
.minispine .b{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--canvas);flex:none}
.minispine .b.done{background:var(--state-done);border-color:var(--state-done)}
.minispine .b.cur{background:var(--brand);border-color:var(--brand-glow);box-shadow:var(--brand-glow-sh)}
.minispine .c{height:1.5px;flex:1;background:var(--border-strong)}
.minispine .c.done{background:var(--state-done)}
.chip.bau{color:var(--ink-muted)}
.chip.retest{color:var(--state-waiting);border-color:color-mix(in srgb,var(--state-waiting) 45%,transparent)}

/* skeleton loading — only on genuinely-async surfaces (report gen, NFR-PER-03) */
.skel{background:linear-gradient(90deg,var(--surface-raised) 25%,color-mix(in srgb,var(--ink) 9%,var(--surface-raised)) 37%,var(--surface-raised) 63%);
  background-size:400% 100%;border-radius:var(--radius-sm);animation:shimmer 1.4s ease infinite}
.skel-line{height:12px;margin:10px 0}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}

/* dashboard tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-3)}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-4);transition:transform var(--dur-fast),border-color var(--dur-fast),box-shadow var(--dur-fast)}
.tile:hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:var(--elev-raised)}
.tile .k{font-size:var(--text-xs);color:var(--ink-muted)}
.tile .v{font-size:var(--text-2xl);font-weight:750;margin-top:4px}
.tile .t{font-size:var(--text-xs);margin-top:2px}
.spark{display:block;width:100%;height:26px;margin:8px 0 2px;opacity:.9}
.up{color:var(--state-blocked)}.down{color:var(--state-done)}

/* alerts (security events) */
.alert{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--state-waiting);border-radius:var(--radius-md);padding:11px var(--space-4);font-size:var(--text-sm)}
.alert.hot{border-left-color:var(--state-blocked)}
.alert .who{margin-left:auto;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--ink-muted)}

/* capacity board */
.cap{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
.cap th{text-align:left;color:var(--ink-muted);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border)}
.cap td{padding:11px 10px;border-bottom:1px solid var(--border)}
.skill{font-size:10px;color:var(--ink-muted);border:1px solid var(--border);border-radius:var(--radius-pill);padding:1px 7px;margin-right:4px}
.load{display:inline-block;width:54px;height:7px;border-radius:4px;background:var(--surface-raised);overflow:hidden;vertical-align:middle}
.load i{display:block;height:100%;background:var(--brand)}
.fit{font-size:var(--text-xs);font-weight:700}.fit.best{color:var(--state-done)}
.heat{display:inline-flex;gap:3px}
.heat .d{width:22px;height:18px;border-radius:4px;border:1px solid var(--border)}
.heatlbl{display:inline-flex;gap:3px;font-size:9px;color:var(--ink-muted)}
.heatlbl span{width:22px;text-align:center}
.heatleg{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);color:var(--ink-muted)}
.heatleg .d{width:14px;height:10px;border-radius:3px;border:1px solid var(--border)}

/* tables (register / users / audit) */
table.t{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
table.t th{text-align:left;color:var(--ink-muted);font-weight:600;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--border)}
table.t td{padding:10px;border-bottom:1px solid var(--border)}
table.t tr:hover td{background:var(--surface-raised)}
.sevchip{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:700;padding:2px 8px;border-radius:var(--radius-sm)}
.sevchip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sevchip.crit{color:var(--sev-critical)}.sevchip.high{color:var(--sev-high)}.sevchip.med{color:var(--sev-medium)}.sevchip.low{color:var(--sev-low)}
.sevchip.crit,.sevchip.high,.sevchip.med,.sevchip.low{background:color-mix(in srgb,currentColor 13%,transparent)}
.pill{font-size:var(--text-xs);padding:2px 9px;border-radius:var(--radius-pill);border:1px solid var(--border)}
.pill.done,.pill.closed,.pill.ok{color:var(--state-done)}.pill.open{color:var(--state-blocked)}.pill.retest{color:var(--state-waiting)}
.pill.remediated{color:var(--brand-glow)}.pill.guest{color:var(--state-waiting)}.pill.warn{color:var(--sev-high)}
/* status pills carry a faint tint of their own status colour — scannable, still colour+text (NFR-USA-03) */
.pill.done,.pill.closed,.pill.ok,.pill.open,.pill.retest,.pill.remediated,.pill.guest,.pill.warn{
  background:color-mix(in srgb,currentColor 13%,transparent);border-color:color-mix(in srgb,currentColor 32%,transparent)}
.q{padding:10px 0;border-bottom:1px solid var(--border)}.q label{display:inline-flex;gap:6px;align-items:center;margin-right:16px;font-size:var(--text-sm)}
.meter{height:8px;border-radius:var(--radius-pill);background:var(--surface-raised);overflow:hidden;margin:6px 0 14px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-glow))}
.maskfield{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:var(--text-sm);background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px var(--space-4)}
.diff{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.pass{color:var(--state-done);font-weight:700}.fail{color:var(--state-blocked);font-weight:700}

/* gate ceremony */
.scrim{position:fixed;inset:0;background:rgba(4,7,14,.66);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50}
.scrim.show{display:grid;animation:fadein var(--dur-base)}
.modal{width:470px;max-width:92vw;background:var(--surface-modal);border:1px solid var(--border-strong);border-radius:var(--radius-lg);box-shadow:var(--elev-modal);padding:var(--space-8);animation:rise var(--dur-base) var(--ease-emphasis)}
@keyframes rise{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:var(--text-xl);margin-bottom:var(--space-4)}
.attest{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-4);margin-bottom:var(--space-4)}
.attest li{list-style:none;padding:4px 0;display:flex;gap:8px}.attest li::before{content:"•";color:var(--brand)}
.chainline{display:flex;align-items:center;gap:8px;font-size:var(--text-sm);color:var(--ink-muted);margin-bottom:var(--space-6)}
.tick{color:var(--state-done)}.modal .actions{display:flex;gap:var(--space-3);justify-content:flex-end}
.reauth{text-align:center;padding:var(--space-6) 0}.reauth .key{font-size:40px}
.toast{position:fixed;bottom:var(--space-8);left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-modal);border:1px solid var(--state-done);color:var(--ink);padding:12px 20px;border-radius:var(--radius-pill);box-shadow:var(--elev-modal);opacity:0;pointer-events:none;transition:all var(--dur-base) var(--ease-emphasis);z-index:60;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ⌘K palette */
.palette{position:fixed;inset:0;background:rgba(4,7,14,.55);backdrop-filter:blur(2px);display:none;justify-content:center;align-items:flex-start;z-index:70}
.palette.show{display:flex}
.pbox{margin-top:12vh;width:560px;max-width:92vw;background:var(--surface-modal);border:1px solid var(--border-strong);border-radius:var(--radius-lg);box-shadow:var(--elev-modal);overflow:hidden;animation:rise var(--dur-base) var(--ease-emphasis)}
.pbox input{width:100%;background:transparent;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:var(--text-lg);padding:16px var(--space-6);border-bottom:1px solid var(--border)}
.presults{max-height:320px;overflow-y:auto;padding:6px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-md);cursor:pointer;font-size:var(--text-sm)}
.pitem .kind{font-size:10px;color:var(--ink-muted);border:1px solid var(--border);border-radius:var(--radius-pill);padding:1px 7px;margin-left:auto}
.pitem.sel,.pitem:hover{background:var(--brand-soft)}
.pfoot{padding:8px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--ink-muted);display:flex;gap:14px}

/* drawer rail + right slide-over — the universal engagement view's depth-on-demand (§4) */
.drawerrail{position:fixed;bottom:var(--space-6);left:calc(50% + 122px);transform:translateX(-50%);display:flex;gap:4px;
  background:color-mix(in srgb,var(--surface-modal) 92%,transparent);border:1px solid var(--border-strong);border-radius:var(--radius-pill);
  padding:5px;box-shadow:var(--elev-modal);backdrop-filter:blur(8px);z-index:40}
.drawerrail button{font:inherit;font-size:var(--text-xs);color:var(--ink-muted);background:transparent;border:none;border-radius:var(--radius-pill);
  padding:7px 13px;cursor:pointer;display:flex;gap:6px;align-items:center;transition:all var(--dur-fast)}
.drawerrail button:hover{color:var(--ink);background:var(--surface-raised)}
.drawerscrim{position:fixed;inset:0;background:rgba(4,7,14,.5);backdrop-filter:blur(2px);display:none;z-index:45}
.drawerscrim.show{display:block;animation:fadein var(--dur-base)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:432px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border-strong);
  box-shadow:var(--elev-drawer);z-index:46;transform:translateX(100%);transition:transform var(--dur-base) var(--ease-standard);display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer header{display:flex;align-items:center;gap:10px;padding:var(--space-6);border-bottom:1px solid var(--border)}
.drawer header b{font-size:var(--text-lg)}
.drawer .dbody{padding:var(--space-4) var(--space-6);overflow-y:auto}
.drawer .x{margin-left:auto;cursor:pointer;color:var(--ink-muted);background:transparent;border:none;font-size:17px;line-height:1;padding:4px}
.drawer .x:hover{color:var(--ink)}

/* responsive: tablet/phone graceful degradation (NFR-USA-04, §15) — desktop rules untouched */
@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr;grid-template-areas:"brand" "topbar" "nav" "main"}
  .brandcell{border-right:none}
  nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:none;border-bottom:1px solid var(--border);gap:6px;padding:8px var(--space-3)}
  .navtab{flex:none}
  .navtab .subbar,.navfoot{display:none}
  main{padding:var(--space-6) var(--space-4)}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .drawer{width:100%}
  .drawerrail{left:50%;bottom:var(--space-4)}
  .modal,.pbox{width:94vw}
}
</style>

<body>

<div class="brandcell"><div class="logo">P</div><b>PEMP</b></div>

<header class="topbar">
  <div class="engrow">
    <span id="ctxLabel" class="eyebrow">Engagement</span>
    <span id="ctxBody" style="display:contents"></span>
    <span class="spacer"></span>
    <label class="sr-only" for="roleSel">Switch role</label>
    <select class="rolesel" id="roleSel"></select>
    <button type="button" class="kbd" id="kbtn" aria-label="Open command palette">⌘K</button>
    <button type="button" class="kbd" id="themeBtn" aria-label="Toggle light or dark theme">◐ Theme</button>
  </div>
  <div class="spine master" id="masterSpine"></div>
</header>

<nav id="nav" role="tablist" aria-label="Sections"></nav>
<main id="main"></main>

  <div class="presults" id="presults" role="listbox" aria-label="Results"></div>
  <div class="pfoot"><span>↑↓ move</span><span>↵ run</span><span>esc close</span><span style="margin-left:auto">RBAC-scoped to your role · §13</span></div>
</div></div>

<div class="drawerscrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
<div class="drawerrail" id="drawerRail" role="toolbar" aria-label="Engagement drawers" style="display:none"></div>

<script>
/* ============================ MODEL ============================ */
// Master engagement spine — shown for engagement-scoped roles.
let master = [
  {k:'intake',l:'Intake',s:'done'},{k:'assign',l:'Assign',s:'done'},
  {k:'scope',l:'Scope',s:'done',tab:'assessment'},{k:'sow',l:'SoW',s:'current',tab:'sow'},
  {k:'access',l:'Access',s:'locked',tab:'access'},{k:'test',l:'Test',s:'locked'},
  {k:'findings',l:'Findings',s:'locked',tab:'findings'},{k:'report',l:'Report',s:'locked',tab:'reports'},
  {k:'retest',l:'Retest',s:'locked',tab:'retests'},
];

const ROLES = {
  acme:{name:'Acme CA Officer',person:'J. Okafor',scoped:false,
    tabs:['home','request','engagements','approvals','reports'],landing:'home'},
  dm:{name:'Delivery Manager',person:'M. Reyes',scoped:false,
    tabs:['home','requests','assignments','capacity','engagements','approvals'],landing:'home'},
  tester:{name:'Penetration Tester',person:'A. Khan',scoped:true,
    tabs:['mywork','assessment','sow','access','findings','reports'],landing:'mywork'},
  stakeholder:{name:'Application Stakeholder',person:'P. Devlin',scoped:true,
    tabs:['myassessment','findings','retests'],landing:'myassessment'},
  admin:{name:'System Administrator',person:'S. Cole',scoped:false,
    tabs:['users','config','audit','integrations'],landing:'users'},
};

// sub-spines per tab (null = no process flow)
let FLOW = {
  'tester:mywork':null,
  'tester:assessment':[{l:'Auth',s:'done'},{l:'Data',s:'done'},{l:'API',s:'done'},{l:'Infra',s:'done'},{l:'Confirm',s:'done'}],
  'tester:sow':[{l:'Draft',s:'done'},{l:'DM review',s:'done'},{l:'Acme sign',s:'current'},{l:'Signed',s:'future'}],
  'tester:access':[{l:'Define prereqs',s:'locked'},{l:'Provision',s:'locked'},{l:'Credentials',s:'locked'},{l:'Verify',s:'locked'}],
  'tester:findings':[{l:'Capture',s:'locked'},{l:'CVSS',s:'locked'},{l:'Register',s:'locked'},{l:'Peer-ready',s:'locked'}],
  'tester:reports':[{l:'Assemble',s:'locked'},{l:'Draft',s:'locked'},{l:'Peer QA',s:'locked'},{l:'Release',s:'locked'}],
  'acme:request':[{l:'Type',s:'done'},{l:'Target',s:'done'},{l:'Window',s:'current'},{l:'Contacts',s:'future'},{l:'Submit',s:'future'}],
  'acme:approvals':[{l:'Pending',s:'done'},{l:'Review',s:'current'},{l:'Sign',s:'future'}],
  'dm:capacity':[{l:'Select request',s:'done'},{l:'Match skills',s:'current'},{l:'Check load',s:'future'},{l:'Assign',s:'future'}],
  'dm:approvals':[{l:'Received',s:'done'},{l:'Review',s:'current'},{l:'Approve → Acme',s:'future'}],
  'stakeholder:myassessment':[{l:'Auth',s:'done'},{l:'Data',s:'current'},{l:'Confirm',s:'future'}],
  'stakeholder:retests':[{l:'Pick fixed',s:'current'},{l:'Request',s:'future'},{l:'Verified',s:'future'}],
};
// locked tabs per role (engagement-gated)
let LOCKED = {'tester:access':true,'tester:findings':true,'tester:reports':true};

const ICON={home:'⌂',request:'＋',engagements:'◉',approvals:'✓',reports:'⚑',requests:'▤',assignments:'👥',capacity:'▦',
  mywork:'◧',assessment:'✎',sow:'📄',access:'🔑',findings:'🐞',myassessment:'✎',retests:'↻',users:'👤',config:'⚙',audit:'🔗',integrations:'🔌'};
const LABEL={home:'Home',request:'New Request',engagements:'Engagements',approvals:'Approvals',reports:'Reports',
  requests:'Requests',assignments:'Assignments',capacity:'Capacity',mywork:'My Work',assessment:'Assessment',sow:'SoW',
  access:'Access',findings:'Findings',myassessment:'My Assessment',retests:'Retests',users:'Users',config:'Configuration',audit:'Audit',integrations:'Integrations'};

let role='tester', tab='mywork';
const fk=()=>`${role}:${tab}`;

/* ============================ RENDER: spine / nav / context ============================ */
function glyph(s){return s==='done'?'✓':s==='locked'?'🔒':'';}
function renderSpine(el,nodes,nav){
  el.innerHTML=nodes.map(n=>{
    const navable = nav && n.tab && ROLES[role].tabs.includes(n.tab);
    const a11y = navable?`data-tab="${n.tab}" role="button" tabindex="0" aria-label="Go to ${n.l}"`:`aria-label="${n.l}: ${n.s}"`;
    return `<div class="node ${n.s} ${navable?'nav':''}" ${a11y}>
      <div class="connector"></div><div class="bead" aria-hidden="true">${glyph(n.s)}</div><div class="lbl">${n.l}</div></div>`;
  }).join('');
  if(nav) el.querySelectorAll('.node.nav').forEach(x=>{const f=()=>go(x.dataset.tab);x.onclick=f;x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}};});
}
function pct(flow){const d=flow.filter(f=>f.s==='done').length;return Math.round(100*d/flow.length);}

function renderContext(){
  const ms=document.getElementById('masterSpine'), cl=document.getElementById('ctxLabel'), cb=document.getElementById('ctxBody');
  if(ROLES[role].scoped){
    ms.style.display='flex'; cl.textContent='Engagement';
    cb.innerHTML=`<span class="name">Claims Portal</span><span class="ref mono muted">ENG-2026-0412</span>
      <span class="chip project">PROJECT</span><span class="chip crit">High</span>`;
    renderSpine(ms,master,true);
  } else {
    ms.style.display='none'; cl.textContent=role==='admin'?'Console':'Portfolio';
    cb.innerHTML=role==='admin'
      ? `<span class="name">System health</span><span class="pill ok">all green</span><span class="muted">· 312 users · 14 active engagements</span>`
      : `<span class="name">14 active engagements</span><span class="muted">· 3 need you · 1 overdue</span>`;
  }
  updateRail();
}
function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=ROLES[role].tabs.map(t=>{
    const flow=FLOW[`${role}:${t}`], locked=LOCKED[`${role}:${t}`], active=t===tab;
    const count = locked?'<span class="count">🔒</span>' : flow?`<span class="count">${pct(flow)}%</span>`:'';
    return `<div class="navtab ${active?'active':''} ${locked?'lockedtab':''}" data-tab="${t}" role="tab" tabindex="0" aria-selected="${active}" ${locked?'aria-disabled="true"':''}>
      <div class="top"><span class="ico" aria-hidden="true">${ICON[t]||'•'}</span> ${LABEL[t]} ${count}</div>
      ${flow?`<div class="subbar"><i style="width:${locked?6:pct(flow)}%"></i></div>`:''}</div>`;
  }).join('')+`<div class="navfoot">${ROLES[role].name} · ${ROLES[role].person}</div>`;
  nav.querySelectorAll('.navtab').forEach(n=>{const f=()=>go(n.dataset.tab);n.onclick=f;n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}};});
}
function renderMain(){
  const flow=FLOW[fk()];
  document.getElementById('main').innerHTML=
    `<section class="screen">${flow?`<div class="spine sub" id="subSpine"></div>`:''}${BODY[fk()]?BODY[fk()]():stub()}</section>`;
  if(flow) renderSpine(document.getElementById('subSpine'),flow,false);
}
function go(t){ if(!ROLES[role].tabs.includes(t))return; tab=t; renderNav(); renderMain(); document.getElementById('main').scrollTo({top:0}); }
function switchRole(r){ role=r; tab=ROLES[r].landing; document.getElementById('roleSel').value=r; renderContext(); renderNav(); renderMain(); }

/* ============================ BODIES ============================ */
const head=(t,s)=>`<div class="eyebrow">${ROLES[role].name}</div><h1 class="title">${t}</h1><p class="sub">${s}</p>`;
const nextCard=(t,o,srs,locked,btn,fn)=>`<div class="card nextaction"><div style="font-size:26px">${locked?'🔒':'▸'}</div>
  <div class="meta"><b>${t}</b><span class="muted">${o} · <span class="srs">${srs}</span></span>${locked?'<div class="lockline">Unlocks earlier in the flow</div>':''}</div>
  ${btn?`<button class="btn primary" onclick="${fn}">${btn}</button>`:''}</div>`;
const PRI={crit:'Critical',high:'High',med:'Medium',low:'Low'};
const arow=(d,v,t,r,sc,sl,b,fn)=>`<div class="row actionable"><span class="dot ${d}" role="img" aria-label="${PRI[d]} priority"></span><div class="grow"><span class="verb">${v}</span> · ${t}<br><span class="ref">${r}</span></div><span class="sla ${sc}">${sl}</span><button class="btn primary" onclick="${fn}">${b}</button></div>`;
const wrow=(d,v,t,m)=>`<div class="row waiting"><span class="dot ${d}" role="img" aria-label="${PRI[d]} priority"></span><div class="grow"><span class="verb">${v}</span> · ${t}<br><span class="ref">${m}</span></div><span class="nudge">Nudge</span></div>`;
// tiny inline sparkline — trend made legible; colour follows the up/down status (NFR-USA-03)
const spark=(pts,cls)=>{const w=100,h=26,mx=Math.max(...pts),mn=Math.min(...pts),rng=(mx-mn)||1;
  const d=pts.map((p,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-3-(p-mn)/rng*(h-6)).toFixed(1)}`).join(' ');
  const col=cls==='up'?'var(--state-blocked)':cls==='down'?'var(--state-done)':'var(--brand-glow)';
  const lx=(w).toFixed(1),ly=(h-3-(pts[pts.length-1]-mn)/rng*(h-6)).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="1.8" fill="${col}"/></svg>`;};
const tile=(k,v,t,cls,sp)=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${sp?spark(sp,cls):''}<div class="t ${cls||''}">${t}</div></div>`;
// weekly load heatmap (Mon–Fri) — busier days run hotter (FR-ASG-04)
const DOW=['Mon','Tue','Wed','Thu','Fri'];
const heat=(days)=>`<div class="heat" role="img" aria-label="Weekly load: ${days.map((v,i)=>DOW[i]+' '+v+'%').join(', ')}">${days.map((v,i)=>`<span class="d" title="${DOW[i]} ${v}%" style="background:color-mix(in srgb,var(--sev-high) ${v}%,var(--surface-raised))"></span>`).join('')}</div>`;
const heatHdr=`<div class="heatlbl">${DOW.map(d=>`<span>${d[0]}</span>`).join('')}</div>`;
const stub=()=>`<div class="empty">This surface follows the same pattern — sub-spine + one primary action + role-filtered content.<br><span style="font-size:var(--text-xs)">Representative screen.</span></div>`;

const BODY={
/* ---- TESTER ---- */
'tester:mywork':()=>`<div class="eyebrow">Home · My Turn</div><h1 class="title">Good morning, Asha.</h1>
  <p class="sub">Two things need you. Three engagements move without you.</p>
  <div class="sectionlabel">▸ Your turn <span class="srs">FR-NOT-01</span></div><div class="pile">
  ${arow('high','Sign the Statement of Work','Claims Portal','ENG-2026-0412','amber','⏱ 2d','Review & Sign ▶',"go('sow')")}
  ${arow('med','Verify access','Payments API','ENG-2026-0419','green','⏱ 4d','Verify access ▶',"go('access')")}
  ${arow('crit','Add findings to draft report','Retail Web','ENG-2026-0408','red','⏱ overdue','Open findings ▶',"go('findings')")}</div>
  <div class="sectionlabel">Waiting on others <span class="srs">FR-NOT-03</span></div><div class="pile">
  ${wrow('low','Awaiting Acme sign-off','Broker Portal','ENG-2026-0415 · with J. Okafor · 1d')}
  ${wrow('med','Access ticket pending','Mobile App','ENG-2026-0421 · INC-8821 · 5d')}</div>
  <div class="empty">You're all clear after these. <b>3 engagements moving without you.</b><br><span style="font-size:var(--text-xs)">Calm. Genuine. No confetti. — §9</span></div>`,
'tester:assessment':()=>head('Assessment','Two-lens questionnaire — completed and confirmed.')+
  nextCard('Assessment confirmed · 100%','Owner: You','FR-SCO-03',false,'',null)+
  `<div class="card"><div class="sectionlabel" style="margin-top:0">Completeness <span class="srs">FR-SCO-03</span></div><div class="meter"><i style="width:100%"></i></div>
  <div class="q"><b>Authentication</b> — Uses SSO? <span class="pill done">Yes ✓</span></div>
  <div class="q"><b>Data handling</b> — PII processed? <span class="pill done">Confirmed ✓</span></div>
  <div class="q" style="border:none"><b>API</b> — Rate-limit thresholds <span class="pill done">Captured ✓</span></div>
  <p class="muted" style="margin-top:10px;font-size:var(--text-sm)">Prefilled from ENG-2025-0331 · <span class="srs">FR-SCO-04</span></p></div>`,
'tester:sow':()=>head('Statement of Work','Auto-drafted from the assessment — sign to unlock testing.')+
  nextCard('Sign the Statement of Work','Owner: You (issuing to Acme)','FR-SOW-06',false,'Review & Sign SoW ▶',"openGate('sign')")+

  <div class="q">● Test account A <span class="pill done">provisioned ✓</span></div>

  <div class="q" style="border:none">○ VPN profile <span class="pill open">not requested</span></div>
  <div class="sectionlabel">Vault-backed credential <span class="srs">SEC-CRD-01</span></div>
  <div class="maskfield">user: svc_pentest_a &nbsp; pass: ••••••••<button class="btn ghost" style="margin-left:auto" ${LOCKED['tester:access']?'disabled':''}>Reveal 🔓</button></div>
  <p class="muted" style="margin-top:8px;font-size:var(--text-sm)">reveal = re-auth + logged · auto-revoke 26 Jul · <span class="srs">SEC-CRD-02/03</span></p></div>`,
'tester:findings':()=>head('Findings · Live Register',LOCKED['tester:findings']?'Locked — opens when testing begins.':'Enter once; flows live into the register.')+
  (LOCKED['tester:findings']?`<div class="lockbanner">🔒 Unlocks after access is verified and testing starts.</div>`:'')+registerTable(LOCKED['tester:findings']),
'tester:reports':()=>head('Reporting',LOCKED['tester:reports']?'Locked — opens when findings are drafted.':'Assemble, peer-review, release.')+
  (LOCKED['tester:reports']?`<div class="lockbanner">🔒 Unlocks once findings exist to draft.</div>`:'')+
  nextCard('Release final report','Owner: You → peer → Acme','FR-REP-02',LOCKED['tester:reports'],LOCKED['tester:reports']?'':'Release ▶',"openGate('release')")+
  `<div style="display:flex;gap:10px;align-items:center;margin-bottom:var(--space-4)"><button class="btn" onclick="genDraft()" ${LOCKED['tester:reports']?'disabled':''}>↻ Generate draft</button><span class="muted" style="font-size:var(--text-xs)">report generation runs async — never a frozen screen · <span class="srs">NFR-PER-03</span></span></div>
  <div id="reportOut"><div class="card" style="${LOCKED['tester:reports']?'opacity:.55':''}"><div class="sectionlabel" style="margin-top:0">Assembled from engagement + findings <span class="srs">FR-REP-01</span></div>
  <p>Exec summary · 7 findings · register snapshot · appendix</p><div class="lockline">🔒 QA GATE: peer review before release <span class="srs">FR-REP-02</span></div></div></div>`,

/* ---- ACME CA OFFICER ---- */
'acme:home':()=>head('Home','Approvals due and reports to read — plus your portfolio at a glance.')+
  `<div class="tiles">${tile('Open engagements','14','3 need you','',[10,11,9,12,13,14])}${tile('Overdue (SLA)','1','SoW unsigned 3d','up',[0,1,0,2,1,1])}${tile('Mean time-to-remediate','11d','▼ from 14d','down',[14,14,13,12,11,11])}${tile('Critical open','2','Auth bypass · SQLi','up',[1,1,2,1,2,2])}</div>
  <div class="sectionlabel">▸ Your turn <span class="srs">FR-NOT-01</span></div><div class="pile">
  ${arow('high','Sign the Statement of Work','Claims Portal','ENG-2026-0412','amber','⏱ 2d','Review & Sign ▶',"go('approvals')")}
  ${arow('low','Read final report','Broker Portal','ENG-2026-0399','green','new','Open report ▶',"go('reports')")}</div>
  <div class="sectionlabel">Portfolio risk <span class="srs">FR-ANL-04</span></div>
  <div class="card"><div class="q">Claims Portal <span class="pill open">High</span></div><div class="q">Payments API <span class="pill warn">Medium</span></div><div class="q" style="border:none">Broker Portal <span class="pill ok">Low</span></div></div>`,
'acme:request':()=>head('New Request','A short friendly wizard — not a long form.')+
  nextCard('Continue request · step 3 of 5','Type: Project · Target: Claims Portal','FR-REQ-01',false,'Next: contacts ▶',"go('engagements')")+
  `<div class="card"><div class="q"><b>Window</b> &nbsp; [ 14 Jul ] — [ 25 Jul ] &nbsp; Criticality [High ▾] <span class="srs">FR-REQ-02</span></div>
  <div class="q" style="border:none">Tested 4 months ago (ENG-2025-0331). <button class="btn ghost">Reuse & prefill</button> <span class="srs">FR-REQ-05</span></div></div>`,
'acme:engagements':()=>head('Engagements','Every engagement, one consistent story.')+engCards(),
'acme:approvals':()=>head('Approvals','Sign-offs queued — each opens the gate ceremony.')+
  nextCard('Review & sign SoW','Claims Portal · ENG-2026-0412','FR-SOW-05',false,'Review & Sign SoW ▶',"openGate('sign')")+
  `<div class="card"><div class="q">Claims Portal · v3 <span class="pill retest">awaiting you</span></div><div class="q" style="border:none">Payments API · v1 <span class="pill done">signed ✓</span></div></div>`,
'acme:reports':()=>head('Reports','Released reports, access-controlled.')+
  `<div class="card"><table class="t"><thead><tr><th>Engagement</th><th>Version</th><th>Status</th></tr></thead><tbody>
  <tr><td>Broker Portal</td><td class="mono">final</td><td><span class="pill done">released</span></td></tr>
  <tr><td>Retail Web</td><td class="mono">draft v2</td><td><span class="pill retest">in QA</span></td></tr></tbody></table></div>`,

/* ============================ GATE CEREMONY ============================ */
const gate=document.getElementById('gate'),modal=document.getElementById('gateModal');
const RM=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let gateKind='sign', lastFocus=null;
function openGate(kind){gateKind=kind||'sign';lastFocus=document.activeElement;gate.classList.add('show');frameAttest();focusModal();}
function closeGate(){if(!gate.classList.contains('show'))return;gate.classList.remove('show');if(lastFocus&&lastFocus.focus)lastFocus.focus();}
function focusModal(){const b=modal.querySelector('.btn.primary');if(b)setTimeout(()=>b.focus(),30);}
gate.onclick=e=>{if(e.target===gate)closeGate();};
function frameAttest(){const sign=gateKind==='sign';
  modal.innerHTML=`<h3 id="gateTitle">${sign?'Sign Statement of Work':'Release final report'}</h3>
  <p class="muted" style="margin-bottom:12px">${sign?'You are agreeing to:':'You are releasing:'}</p>
  <ul class="attest">${sign?'<li>Scope: Claims Portal web + API</li><li>Dates: 14–25 Jul 2026</li><li>Prerequisites: 3 test accounts, VPN</li>':'<li>Final report v-final</li><li>7 findings · register snapshot</li><li>Peer QA: passed (R. Patel)</li>'}</ul>
  <div class="chainline"><span class="tick">🔗</span> Creates an immutable, hash-chained record &nbsp;<span class="srs">SEC-AUD-01</span></div>
  <div class="actions"><button class="btn ghost" onclick="closeGate()">Cancel</button><button class="btn primary" onclick="frameReauth()">${sign?'Confirm sign':'Confirm release'}</button></div>`;}
function frameReauth(){modal.innerHTML=`<h3 id="gateTitle">Confirm it's you</h3><div class="reauth"><div class="key" aria-hidden="true">🔐</div>
  <p class="muted">Re-authenticate via Entra MFA for this privileged action.<br><span class="srs">SEC-IAM-04</span></p></div>
  <div class="actions"><button class="btn ghost" onclick="closeGate()">Cancel</button><button class="btn primary" onclick="frameCommit()">Verify with Entra ▶</button></div>`;focusModal();}
function frameCommit(){modal.innerHTML=`<h3 id="gateTitle">${gateKind==='sign'?'Signing…':'Releasing…'}</h3><div class="reauth"><div class="key" aria-hidden="true" style="${RM()?'':'animation:pulse 1s infinite'}">${gateKind==='sign'?'✍️':'📤'}</div>
  <p class="muted">1) record · 2) hash-chain append · 3) state transition</p></div>`;setTimeout(()=>gateKind==='sign'?payoffSign():payoffRelease(),RM()?0:900);}

function payoffSign(){closeGate();
  master.find(n=>n.k==='sow').s='done'; master.find(n=>n.k==='access').s='current';
  if(FLOW['tester:sow']) FLOW['tester:sow'].forEach(f=>f.s='done');
  LOCKED['tester:access']=false;
  FLOW['tester:access']=[{l:'Define prereqs',s:'done'},{l:'Provision',s:'current'},{l:'Credentials',s:'future'},{l:'Verify',s:'future'}];
  if(ROLES[role].scoped) renderSpine(document.getElementById('masterSpine'),master,true);
  const acc=[...document.querySelectorAll('#masterSpine .node')].find(n=>n.dataset.tab==='access'); if(acc)acc.classList.add('justunlocked');
  if(role==='tester'&&(tab==='sow')){tab='access';}
  renderNav(); renderMain(); toast('SoW signed. Testing unlocked.');}
function payoffRelease(){closeGate(); master.find(n=>n.k==='report').s='done';
  if(ROLES[role].scoped) renderSpine(document.getElementById('masterSpine'),master,true);
  renderNav(); renderMain(); toast('Report released. Stored immutable.');}
function verifyAccess(){FLOW['tester:access']=[{l:'Define prereqs',s:'done'},{l:'Provision',s:'done'},{l:'Credentials',s:'done'},{l:'Verify',s:'done'}];
  master.find(n=>n.k==='access').s='done'; master.find(n=>n.k==='test').s='current';
  LOCKED['tester:findings']=false; FLOW['tester:findings']=[{l:'Capture',s:'current'},{l:'CVSS',s:'future'},{l:'Register',s:'future'},{l:'Peer-ready',s:'future'}];
  if(ROLES[role].scoped) renderSpine(document.getElementById('masterSpine'),master,true);
  renderNav(); renderMain(); toast('Access verified. Test window open.');}
function toast(m){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
const skelBlock=(n)=>`<div class="card">${Array.from({length:n}).map((_,i)=>`<div class="skel skel-line" style="width:${[92,72,84,60,78][i%5]}%"></div>`).join('')}</div>`;
function genDraft(){const o=document.getElementById('reportOut');if(!o)return;
  o.innerHTML=`<div class="sectionlabel" style="margin-top:0">Assembling report… <span class="muted">async · NFR-PER-03</span></div>`+skelBlock(5);

/* ============================ ⌘K PALETTE (RBAC-scoped) ============================ */
const pal=document.getElementById('palette'),pin=document.getElementById('pinput'),pres=document.getElementById('presults');
let pidx=0,pcmds=[],lastFocusP=null;
function buildCmds(){
  const nav=ROLES[role].tabs.map(t=>({kind:'Go',label:`Go to ${LABEL[t]}`,run:()=>go(t)}));
  const acts=[];
  if(role==='tester'){acts.push({kind:'Act',label:'Sign SoW · Claims Portal',run:()=>{go('sow');openGate('sign');}},{kind:'Act',label:'Verify access · Payments API',run:()=>go('access')},{kind:'Act',label:'Add finding',run:()=>go('findings')});}
  if(role==='acme'){acts.push({kind:'Act',label:'Sign SoW · Claims Portal',run:()=>{go('approvals');openGate('sign');}},{kind:'Act',label:'Raise new request',run:()=>go('request')});}
  if(role==='dm'){acts.push({kind:'Act',label:'Assign tester · Claims Portal',run:()=>go('capacity')});}
  if(role==='stakeholder'){acts.push({kind:'Act',label:'Request retest',run:()=>go('retests')});}
  if(role==='admin'){acts.push({kind:'Act',label:'Verify audit chain',run:()=>go('audit')},{kind:'Act',label:'Search audit log',run:()=>go('audit')});}
  const search=[{kind:'Find',label:'ENG-2026-0412 · Claims Portal',run:()=>{if(ROLES[role].scoped)go(ROLES[role].landing);else go('engagements'in LABEL&&ROLES[role].tabs.includes('engagements')?'engagements':ROLES[role].landing);}}];
  return [...acts,...nav,...search];
}
function openPalette(){lastFocusP=document.activeElement;pcmds=buildCmds();pidx=0;pin.value='';pal.classList.add('show');renderPal();setTimeout(()=>pin.focus(),30);}
function closePalette(){if(!pal.classList.contains('show'))return;pal.classList.remove('show');if(lastFocusP&&lastFocusP.focus)lastFocusP.focus();}
function renderPal(){const q=pin.value.toLowerCase();const f=pcmds.filter(c=>c.label.toLowerCase().includes(q));
  if(pidx>=f.length)pidx=Math.max(0,f.length-1);
  pres.innerHTML=f.length?f.map((c,i)=>`<div class="pitem ${i===pidx?'sel':''}" id="pitem-${i}" role="option" aria-selected="${i===pidx}" data-i="${i}"><span>${c.label}</span><span class="kind">${c.kind}</span></div>`).join('')
    :`<div class="muted" style="padding:10px 14px">No matches</div>`;
  pin.setAttribute('aria-activedescendant', f.length?`pitem-${pidx}`:'');
  pres.querySelectorAll('.pitem[data-i]').forEach(el=>el.onclick=()=>{f[+el.dataset.i].run();closePalette();});
  pres._f=f;}
pin.addEventListener('input',()=>{pidx=0;renderPal();});
pin.addEventListener('keydown',e=>{const f=pres._f||[];
  if(e.key==='ArrowDown'){e.preventDefault();pidx=Math.min(f.length-1,pidx+1);renderPal();}
  else if(e.key==='ArrowUp'){e.preventDefault();pidx=Math.max(0,pidx-1);renderPal();}
  else if(e.key==='Enter'){e.preventDefault();if(f[pidx]){f[pidx].run();closePalette();}}
  else if(e.key==='Escape'){closePalette();}});

    <p class="muted" style="font-size:var(--text-xs);margin-top:10px">Append-only · hash-chained · SEC-AUD-01</p>`},
};
let lastFocusD=null;
function updateRail(){const rail=document.getElementById('drawerRail');
  if(!ROLES[role].scoped){rail.style.display='none';return;}
  rail.style.display='flex';
  rail.innerHTML=Object.entries(DRAWERS).map(([k,d])=>`<button type="button" data-d="${k}" aria-label="Open ${d.title}">${d.icon} ${d.title}</button>`).join('');
  rail.querySelectorAll('button').forEach(b=>b.onclick=()=>openDrawer(b.dataset.d));}
function openDrawer(k){const d=DRAWERS[k];if(!d)return;lastFocusD=document.activeElement;
  const dr=document.getElementById('drawer');
  dr.innerHTML=`<header><span aria-hidden="true">${d.icon}</span><b id="drawerTitle">${d.title}</b><span class="srs">${d.srs}</span>
    <button class="x" aria-label="Close drawer" onclick="closeDrawer()">✕</button></header><div class="dbody">${d.html}</div>`;
  document.getElementById('drawerScrim').classList.add('show');dr.classList.add('show');
  setTimeout(()=>{const x=dr.querySelector('.x');if(x)x.focus();},30);}
function closeDrawer(){const dr=document.getElementById('drawer');if(!dr.classList.contains('show'))return;
  dr.classList.remove('show');document.getElementById('drawerScrim').classList.remove('show');
  if(lastFocusD&&lastFocusD.focus)lastFocusD.focus();}

const rs=document.getElementById('roleSel');
rs.innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
rs.value='tester'; rs.onchange=()=>switchRole(rs.value);
document.getElementById('themeBtn').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';};
document.getElementById('kbtn').onclick=openPalette;
document.getElementById('drawerScrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();}if(e.key==='Escape'){closeGate();closePalette();closeDrawer();}});
renderContext(); renderNav(); renderMain();
